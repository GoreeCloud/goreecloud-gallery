schema_version: "0.2"

component:
  type: application
  id: goreecloud-gallery
  product_name: GoreeCloud Gallery
  repository: GoreeCloud/goreecloud-gallery

lifecycle: development
version: "0.7.1-dev"

supported_platforms:
  - android

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
      - README.md
      - SPECIFICATIONS.md
    notes: Gallery is a first-party GoreeCloud application, but accepted Manager platform visibility and administrative integration are not established.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - SECURITY.md
      - SPECIFICATIONS.md
      - native/app/src/main/kotlin/com/goreecloud/gallery/GalleryMediaAccessPolicy.kt
      - native/app/src/main/AndroidManifest.xml
    notes: Current source keeps local media access behind Android authorization and remains offline-first, but accepted Privacy Shield integration and production privacy validation are not established.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - SECURITY.md
      - SPECIFICATIONS.md
      - native/app/src/main/kotlin/com/goreecloud/gallery/GalleryPhotoEditPolicy.kt
      - native/app/src/main/kotlin/com/goreecloud/gallery/GalleryEditedMediaStore.kt
    notes: Gallery has bounded local media and editing safeguards, but accepted Wardveil Security integration and validation are not established.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - SPECIFICATIONS.md
      - USER-MANUAL.md
    notes: Gallery has local settings and Favorites portability plus Android-authorized Trash and Restore behavior, but accepted Everkeep integration and complete Gallery-owned recovery acceptance are not established.
  glaze_ui:
    result: applicable-migration-required
    version: "1.0.0"
    evidence:
      - native/app/src/main/kotlin/com/goreecloud/gallery/GalleryGlazeContract.kt
      - native/app/src/test/kotlin/com/goreecloud/gallery/GalleryGlazeContractTest.kt
      - docs/GLAZE-UI.md
    notes: The active native source contract remains GLAZE UI 1.0.0. The current required GoreeCloud consumer target is GLAZE UI V1.3 / 1.3.0 Adaptive Resonance. Gallery must migrate deliberately and repeat application-specific rendered, accessibility, adaptive, representative-device, Human Visual Excellence, rollback, release, and production acceptance before conformance may be claimed.
  mesh:
    result: applicable-blocked
    version: null
    evidence: []
    notes: Local Gallery use does not depend on Mesh, but accepted GoreeCloud Mesh registration, capability publication, and runtime integration are not established.
    capabilities: []
    dependencies: []
    published_events: []
    consumed_events: []
  identity:
    result: applicable-blocked
    version: null
    evidence:
      - SPECIFICATIONS.md
    notes: Device-local browsing does not require a GoreeCloud account, but accepted Identity integration for any future account, Photos, device, or delegated-authority behavior is not established.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Define the approved Gallery-owned durable-state backup scope without treating Android-owned photo and video content as Gallery backup data.
      - Preserve user/profile isolation and exclude unapproved hidden, protected, credential, and sensitive metadata from backup scope.
  restore:
    required: true
    requirements:
      - Validate Gallery-owned restored preferences and collections before applying them.
      - Keep Android MediaStore authoritative for device media and Trash state.
  export:
    required: true
    requirements:
      - Keep user-initiated Gallery settings and Favorites export bounded to Gallery-owned state.
      - Do not silently export device media, protected content, credentials, or unrelated provider metadata.
  portability:
    required: true
    requirements:
      - Keep Gallery-owned portability explicit, versioned, documented, and separately reviewed from Android-owned media storage.

external_dependencies:
  - name: Android platform
    purpose: Application lifecycle, MediaStore access and mutation authorization, media permissions, Storage Access Framework where used, accessibility, and device execution environment.
    required: true
    version_constraint: ">=29"

compatibility:
  platform_contract: "0.2"
  glaze_ui_required: "1.3.0"
  requires:
    - goreecloud-platform-contract==0.2
    - glaze-ui==1.3.0
    - android-api>=29
  provides: []

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - README.md
    - SPECIFICATIONS.md
    - SECURITY.md
    - USER-MANUAL.md
    - native/app/src/main/AndroidManifest.xml
    - native/app/src/main/kotlin/com/goreecloud/gallery/GalleryGlazeContract.kt
    - native/app/src/main/kotlin/com/goreecloud/gallery/GalleryMediaAccessPolicy.kt
    - native/app/src/main/kotlin/com/goreecloud/gallery/GalleryPhotoEditPolicy.kt
    - native/app/src/main/kotlin/com/goreecloud/gallery/GalleryEditedMediaStore.kt
    - docs/GLAZE-UI.md
  blockers:
    - Active native source remains on the GLAZE UI 1.0.0 source contract and requires deliberate migration to current Stable 1.3.0 plus fresh application acceptance.
    - Privacy Shield integration and acceptance are not established.
    - Wardveil Security integration and acceptance are not established.
    - Everkeep integration and complete Gallery-owned backup and recovery acceptance are not established.
    - GoreeCloud Identity integration is not established for any future identity-aware or Photos-backed capability.
    - GoreeCloud Mesh registration, capability publication, and runtime acceptance are not established.
    - Manager platform visibility and administrative integration acceptance are not established.
    - Representative physical-device/OEM/profile photo-editor, accessibility, orientation, media-permission, and destructive-operation edge-case acceptance remains incomplete.
    - Production signing, distribution, release approval, Release Candidate qualification, and Stable qualification remain outstanding.
