name: Native Android Adapter

on:
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-android-adapter.yml"
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-android-adapter.yml"

permissions:
  contents: read

jobs:
  android-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"
      - name: Test native core and Android adapter
        run: gradle :core:test :android-adapter:testDebugUnitTest --no-daemon
      - name: Build Android adapter
        run: gradle :android-adapter:assembleDebug --no-daemon
