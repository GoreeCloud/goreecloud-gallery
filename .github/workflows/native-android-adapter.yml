name: Native Android Adapter

on:
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native-android-adapter.yml"
  push:
    branches: [main]
    paths:
      - "native/**"
      - ".github/workflows/native-android-adapter.yml"

permissions:
  contents: read

jobs:
  android-adapter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: "8.14.3"
      - name: Test native core and Android adapter
        run: gradle :core:test :android-adapter:testDebugUnitTest --no-daemon
      - name: Build Android adapter
        run: gradle :android-adapter:assembleDebug --no-daemon
