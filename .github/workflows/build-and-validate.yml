name: Build and validate GoreeCloud Gallery gc.7

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'scripts/**'
      - '.github/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'NOTICE.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'patches/**'
      - 'scripts/**'
      - '.github/**'
      - 'README.md'
      - 'SECURITY.md'
      - 'CONTRIBUTING.md'
      - 'NOTICE.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goreecloud-gallery-gc7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out GoreeCloud Gallery exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Verify exact repository revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          printf 'Validated repository revision: %s\n' "$EXPECTED_SHA"

      - name: Validate repository structure
        run: bash scripts/validate-repository-structure.sh

      - name: Validate repository security guardrails
        run: bash scripts/validate-repository-security.sh

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct exact GoreeCloud source
        run: bash scripts/reconstruct-source.sh

      - name: Validate GoreeCloud source acceptance invariants
        run: bash scripts/validate-source-invariants.sh

      - name: Run Android unit-test task and lint
        shell: bash
        working-directory: upstream-gallery
        run: |
          set -euo pipefail
          mkdir -p ../dist/validation
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testFossDebugUnitTest :app:lintFossDebug 2>&1 \
            | tee ../dist/validation/gradle-test-lint.log

          if grep -Fq '> Task :app:testFossDebugUnitTest NO-SOURCE' ../dist/validation/gradle-test-lint.log; then
            cat > ../dist/validation/unit-test-coverage.txt <<'EOF'
          task=:app:testFossDebugUnitTest
          task_status=success
          no_source=true
          meaningful_behavioral_unit_tests_executed=false
          interpretation=The upstream Gradle unit-test task succeeded but executed no unit-test sources. This is not behavioral test coverage.
          EOF
          else
            cat > ../dist/validation/unit-test-coverage.txt <<'EOF'
          task=:app:testFossDebugUnitTest
          task_status=success
          no_source=false
          meaningful_behavioral_unit_tests_executed=review-test-report
          interpretation=Unit-test sources were not reported as NO-SOURCE. Review retained test reports to confirm what executed.
          EOF
          fi

      - name: Build installable FOSS acceptance APK
        working-directory: upstream-gallery
        run: ./gradlew --no-daemon --stacktrace :app:assembleFossDebug

      - name: Collect and validate acceptance evidence
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/validation
          mapfile -t apks < <(find upstream-gallery/app/build/outputs/apk/foss/debug -type f -name '*.apk' | sort)
          test "${#apks[@]}" -eq 1

          APK="dist/GoreeCloud-Gallery-1.0.0-gc.7.apk"
          cp "${apks[0]}" "$APK"

          CHECKSUM_OUTPUT="dist/GoreeCloud-Gallery-1.0.0-gc.7.sha256" \
          EXPECTED_DEBUGGABLE=true \
            bash scripts/validate-apk.sh "$APK" 1.0.0-gc.7 2>&1 \
            | tee dist/validation/apk-validation.txt

          bash scripts/write-build-evidence.sh \
            "$APK" \
            1.0.0-gc.7 \
            acceptance-candidate \
            dist/validation/build-evidence.txt

          cp upstream-gallery/GOREECLOUD-NOTICE.md dist/GOREECLOUD-NOTICE.md
          cp upstream-gallery/LICENSE dist/LICENSE-GPL-3.0.txt

          if [ -d upstream-gallery/app/build/reports ]; then
            find upstream-gallery/app/build/reports -maxdepth 1 -type f -name 'lint-results-fossDebug.*' \
              -exec cp {} dist/validation/ \;
          fi

          if [ -d upstream-gallery/app/build/reports/tests ]; then
            cp -R upstream-gallery/app/build/reports/tests dist/validation/test-reports
          fi

          if [ -f upstream-gallery/build/reports/problems/problems-report.html ]; then
            cp upstream-gallery/build/reports/problems/problems-report.html dist/validation/gradle-problems-report.html
          fi

      - name: Upload acceptance artifact and validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: GoreeCloud-Gallery-gc7-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
