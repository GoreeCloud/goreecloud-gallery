name: Build and validate GoreeCloud Gallery gc.7

on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths:
      - 'patches/**'
      - 'scripts/**'
      - '.github/workflows/**'
      - 'README.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: goreecloud-gallery-gc7-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out GoreeCloud Gallery
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct exact GoreeCloud source
        run: bash scripts/reconstruct-source.sh

      - name: Validate GoreeCloud source acceptance invariants
        run: bash scripts/validate-source-invariants.sh

      - name: Run Android unit-test task and lint
        working-directory: upstream-gallery
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:testFossDebugUnitTest :app:lintFossDebug

      - name: Build installable FOSS acceptance APK
        working-directory: upstream-gallery
        run: ./gradlew --no-daemon --stacktrace :app:assembleFossDebug

      - name: Collect and validate acceptance evidence
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist/validation
          mapfile -t apks < <(find upstream-gallery/app/build/outputs/apk/foss/debug -type f -name '*.apk' | sort)
          test "${#apks[@]}" -eq 1

          APK="dist/GoreeCloud-Gallery-1.0.0-gc.7.apk"
          cp "${apks[0]}" "$APK"

          CHECKSUM_OUTPUT="dist/GoreeCloud-Gallery-1.0.0-gc.7.sha256" \
          EXPECTED_DEBUGGABLE=true \
            bash scripts/validate-apk.sh "$APK" 1.0.0-gc.7

          cp upstream-gallery/GOREECLOUD-NOTICE.md dist/GOREECLOUD-NOTICE.md
          cp upstream-gallery/LICENSE dist/LICENSE-GPL-3.0.txt

          if [ -d upstream-gallery/app/build/reports ]; then
            find upstream-gallery/app/build/reports -maxdepth 1 -type f -name 'lint-results-fossDebug.*' \
              -exec cp {} dist/validation/ \;
          fi

          if [ -f upstream-gallery/build/reports/problems/problems-report.html ]; then
            cp upstream-gallery/build/reports/problems/problems-report.html dist/validation/gradle-problems-report.html
          fi

      - name: Upload acceptance artifact and validation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: GoreeCloud-Gallery-gc7-APK
          path: dist/
          if-no-files-found: error
          retention-days: 30
